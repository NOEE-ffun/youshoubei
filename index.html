<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="view-transition" content="same-origin">
  <title>右手杯</title>
  <link rel="prefetch" href="schedule.html">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#main-content">跳到主要内容</a>
  <div id="bg-layer" aria-hidden="true"></div>
  <header id="app-header"></header>

  <!-- 主页主内容为空壳：标题卡片已于 2026-08-14 移除，主视觉为下方跑马灯；
       main 保留作为“跳过链接”的跳转目标并撑起页面高度 -->
  <main class="home-main" id="main-content" tabindex="-1"></main>

  <!-- 选手跑马灯：双行反向滚动，联动赛程页填写的选手信息 -->
  <div class="home-marquee" aria-label="参赛选手">
    <div class="marquee-row">
      <div class="marquee-track" id="marquee-track"></div>
    </div>
    <div class="marquee-row">
      <div class="marquee-track marquee-track-reverse" id="marquee-track-reverse"></div>
    </div>
  </div>

  <script src="bracket-model.js"></script>
  <script src="common.js"></script>
  <script src="home.js"></script>
</body>
</html>
