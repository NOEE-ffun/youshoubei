<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>赛制面板</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="home-page">
  <!-- 流体渐变背景与噪点质感 -->
  <div class="home-bg" aria-hidden="true"></div>
  <div class="home-noise" aria-hidden="true"></div>

  <main class="home-main">
    <!-- 主视觉：线稿右手夹卡牌（半透明，位于标题后方） -->
    <div class="home-hero" aria-hidden="true">
      <svg class="hand-svg" viewBox="0 0 400 460">
        <!-- 双层描边：底层常显，上层亮点沿线条循环流动（见 styles.css） -->
        <g class="hand-base">
          <path class="finger back" d="M 285 470 C 288 420 278 380 268 355" />
          <path class="finger back" d="M 255 470 C 258 410 250 360 243 315" />
          <g transform="rotate(-10 200 165)">
            <rect class="card-frame" x="125" y="60" width="150" height="210" rx="14" />
            <rect class="card-inner" x="140" y="75" width="120" height="180" rx="10" />
            <line class="card-line" x1="150" y1="95" x2="240" y2="95" />
          </g>
          <path class="thumb" d="M 140 470 C 100 400 100 320 135 285" />
          <path class="finger" d="M 222 470 L 222 100" />
          <path class="finger" d="M 178 470 L 178 112" />
        </g>
        <g class="hand-glow">
          <path class="finger back" d="M 285 470 C 288 420 278 380 268 355" />
          <path class="finger back" d="M 255 470 C 258 410 250 360 243 315" />
          <g transform="rotate(-10 200 165)">
            <rect class="card-frame" x="125" y="60" width="150" height="210" rx="14" />
            <rect class="card-inner" x="140" y="75" width="120" height="180" rx="10" />
            <line class="card-line" x1="150" y1="95" x2="240" y2="95" />
          </g>
          <path class="thumb" d="M 140 470 C 100 400 100 320 135 285" />
          <path class="finger" d="M 222 470 L 222 100" />
          <path class="finger" d="M 178 470 L 178 112" />
        </g>
      </svg>
    </div>

    <!-- 标题与入口 -->
    <div class="home-copy">
      <h1 class="home-title">赛制面板</h1>
      <p class="home-sub">TOURNAMENT · ARENA</p>
      <a class="home-cta" href="schedule.html">进入赛程</a>
    </div>
  </main>
</body>
</html>
