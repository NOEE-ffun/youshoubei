<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="view-transition" content="same-origin">
  <meta name="description" content="右手杯选手中心:提交卡组、报名比赛、维护个人资料。">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: https: data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <title>选手中心 - 右手杯</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏆</text></svg>">
  <link rel="prefetch" href="index.html">
  <link rel="prefetch" href="schedule.html">
  <link rel="prefetch" href="poster.html">
  <script src="theme-init.js?v=2026090036"></script>
  <link rel="stylesheet" href="styles.css?v=2026090036">
</head>
<body data-page="me">
  <a class="skip-link" href="#main-content">跳到主要内容</a>
  <div id="bg-layer" aria-hidden="true"></div>
  <header id="app-header"></header>
  <aside id="app-sidebar" class="app-sidebar" aria-label="主导航">
    <nav class="side-nav" aria-label="主导航">
      <a class="side-link" href="index.html" data-page="home" title="主页" aria-label="主页"><span class="side-icon" aria-hidden="true"><img class="icon" src="icons/home.svg" alt="主页" aria-hidden="true"></span></a>
      <a class="side-link" href="schedule.html" data-page="match" title="比赛" aria-label="比赛"><span class="side-icon" aria-hidden="true"><img class="icon" src="icons/emoji_events.svg" alt="比赛" aria-hidden="true"></span></a>
      <a class="side-link" href="players.html" data-page="players" title="选手库" aria-label="选手库"><span class="side-icon" aria-hidden="true"><img class="icon" src="icons/groups.svg" alt="选手库" aria-hidden="true"></span></a>
      <a class="side-link" href="poster.html" data-page="poster" title="海报" aria-label="海报"><span class="side-icon" aria-hidden="true"><img class="icon" src="icons/vs_poster.svg" alt="海报" aria-hidden="true"></span></a>
      <a class="side-link" href="stats.html" data-page="stats" title="数据统计" aria-label="数据统计"><span class="side-icon" aria-hidden="true"><img class="icon" src="icons/bar_chart.svg" alt="数据统计" aria-hidden="true"></span></a>
      <a class="side-link" href="docs.html?v=2026090036" data-page="docs" title="官方文档" aria-label="官方文档"><span class="side-icon" aria-hidden="true"><img class="icon" src="icons/rule.svg" alt="官方文档" aria-hidden="true"></span></a>
      <a class="side-link" href="me.html" data-page="me" title="选手中心" aria-label="选手中心"><span class="side-icon" aria-hidden="true"><img class="icon" src="icons/person.svg" alt="选手中心" aria-hidden="true"></span></a>
    </nav>
  </aside>

  <div class="layout-body">
    <main id="main-content" tabindex="-1">
      <div id="me-empty" hidden>
        <p id="me-empty-text" class="hint">未登录。</p>
        <button type="button" id="me-login-btn" class="btn btn-primary" hidden>登录</button>
      </div>

      <div id="me-shell" hidden>
        <nav class="me-tabs" role="tablist" aria-label="选手中心功能区">
          <button type="button" class="me-tab" id="me-tab-decks" role="tab" aria-controls="me-panel-decks">我的对局</button>
          <button type="button" class="me-tab" id="me-tab-tourneys" role="tab" aria-controls="me-panel-tourneys">我的比赛</button>
          <button type="button" class="me-tab" id="me-tab-profile" role="tab" aria-controls="me-panel-profile">资料与账号</button>
          <button type="button" class="me-tab" id="me-tab-codes" role="tab" aria-controls="me-panel-codes" hidden>发码中心</button>
        </nav>

        <section class="me-panel" id="me-panel-decks" role="tabpanel" aria-labelledby="me-tab-decks" hidden>
          <div id="my-decks-empty" hidden>
            <p id="my-decks-empty-text" class="hint">未登录。</p>
            <button type="button" id="my-decks-login-btn" class="btn btn-primary" hidden>登录</button>
          </div>

          <div id="my-decks-body" hidden>
            <div class="my-decks-toolbar">
              <label for="my-decks-tournament">比赛</label>
              <select id="my-decks-tournament"></select>
              <span id="my-decks-window-state" class="my-decks-window-chip"></span>
            </div>
            <div id="my-decks-list" class="my-decks-list"></div>
          </div>
        </section>

        <section class="me-panel" id="me-panel-tourneys" role="tabpanel" aria-labelledby="me-tab-tourneys" hidden>
          <div id="my-tourneys-empty" hidden>
            <p id="my-tourneys-empty-text" class="hint">未登录。</p>
            <button type="button" id="my-tourneys-login-btn" class="btn btn-primary" hidden>登录</button>
          </div>

          <div id="my-tourneys-body" hidden>
            <div id="my-tourneys-list" class="my-decks-list"></div>
          </div>
        </section>

        <section class="me-panel" id="me-panel-profile" role="tabpanel" aria-labelledby="me-tab-profile" hidden>
          <div id="profile-empty" hidden>
            <p id="profile-empty-text" class="hint">未登录。</p>
            <button type="button" id="profile-login-btn" class="btn btn-primary" hidden>登录</button>
          </div>

          <section id="redeem-section" aria-labelledby="redeem-title" class="me-subsection" hidden>
            <h2 id="redeem-title" class="subsection-title">升级与绑定</h2>
            <form id="redeem-form" class="redeem-form">
              <label class="form-field">
                <span class="form-label">验证码</span>
                <input type="text" id="redeem-code" maxlength="16" placeholder="管理员码" autocomplete="off">
              </label>
              <button type="submit" class="btn btn-primary btn-sm">兑换</button>
              <span class="hint">管理员码升级为管理员;选手档案注册时已自动创建。</span>
            </form>
            <form id="phone-bind-form" class="phone-bind" hidden>
              <label class="form-field">
                <span class="form-label">绑定手机号</span>
                <input type="tel" id="bind-phone" inputmode="numeric" maxlength="11" placeholder="11 位手机号">
              </label>
              <label class="form-field">
                <span class="form-label">验证码</span>
                <span class="bind-code-row">
                  <input type="text" id="bind-code" maxlength="6" placeholder="先点右侧获取">
                  <button type="button" class="btn btn-secondary btn-sm" id="bind-send-btn">获取验证码</button>
                </span>
              </label>
              <button type="submit" class="btn btn-primary btn-sm">绑定</button>
            </form>
            <form id="nickname-form" class="redeem-form">
              <label class="form-field">
                <span class="form-label">账号昵称</span>
                <input type="text" id="account-nickname" maxlength="24" placeholder="账号展示名;注册时已自动创建选手档案">
              </label>
              <button type="submit" class="btn btn-secondary btn-sm">保存昵称</button>
            </form>
            <p class="hint" id="redeem-status" role="status" aria-live="polite"></p>
          </section>

          <section id="profile-card" hidden aria-labelledby="profile-card-title">
            <h2 id="profile-card-title" class="visually-hidden">选手资料</h2>
            <p class="hint">账号名 <strong id="profile-username"></strong>(用于登录,不可修改);以下信息全站展示。</p>

            <div class="form-field">
              <label>头像</label>
              <div class="profile-avatar-row">
                <span id="profile-avatar-preview"></span>
                <input type="file" id="profile-avatar-file" accept="image/*" class="visually-hidden">
                <button type="button" id="profile-avatar-upload" class="btn btn-secondary btn-sm">上传头像</button>
                <button type="button" id="profile-avatar-remove" class="btn btn-ghost btn-sm" hidden>移除</button>
              </div>
            </div>

            <div class="form-field">
              <label for="profile-name">昵称</label>
              <input type="text" id="profile-name" maxlength="24" placeholder="展示在赛程/统计/海报上的名字">
            </div>

            <div class="form-field">
              <label for="profile-tag">队伍 / ID</label>
              <input type="text" id="profile-tag" maxlength="16" placeholder="如 DK.FIRE(可选)">
            </div>

            <div class="form-field">
              <label>队标图片(可选,替代文字 ID)</label>
              <div class="profile-avatar-row">
                <img id="profile-tagimg-preview" class="profile-tagimg-preview" alt="队标预览" hidden>
                <input type="file" id="profile-tagimg-file" accept="image/*" class="visually-hidden">
                <button type="button" id="profile-tagimg-upload" class="btn btn-secondary btn-sm">上传队标</button>
                <button type="button" id="profile-tagimg-remove" class="btn btn-ghost btn-sm" hidden>移除队标</button>
              </div>
              <div class="profile-range-row">
                <label for="profile-tagimg-size">队标大小</label>
                <input type="range" id="profile-tagimg-size" min="32" max="160" step="4">
              </div>
            </div>

            <div class="form-field">
              <label for="profile-title">赛前垃圾话(可选)</label>
              <input type="text" id="profile-title" maxlength="30" placeholder="展示在海报上的宣言">
            </div>

            <div class="form-field">
              <label for="profile-color">海报颜色</label>
              <div class="profile-avatar-row">
                <input type="color" id="profile-color" value="#4a5568">
                <button type="button" id="profile-color-clear" class="btn btn-ghost btn-sm">跟随主题</button>
                <span class="hint" id="profile-color-hint"></span>
              </div>
            </div>

            <div class="dialog-actions">
              <button type="button" id="profile-save" class="btn btn-primary">保存资料</button>
            </div>
          </section>

          <section id="profile-password" hidden aria-labelledby="profile-password-title">
            <h2 id="profile-password-title">修改密码</h2>
            <div class="form-field">
              <label for="profile-pass-current">当前密码</label>
              <input type="password" id="profile-pass-current" autocomplete="current-password" maxlength="72">
            </div>
            <div class="form-field">
              <label for="profile-pass-next">新密码(8-72 位)</label>
              <input type="password" id="profile-pass-next" autocomplete="new-password" maxlength="72">
            </div>
            <div class="dialog-actions">
              <button type="button" id="profile-pass-save" class="btn btn-secondary">修改密码</button>
            </div>
          </section>

          <div class="dialog-actions" id="profile-logout-row" hidden>
            <button type="button" id="profile-logout" class="btn btn-ghost">退出登录</button>
          </div>
        </section>

        <section class="me-panel" id="me-panel-codes" role="tabpanel" aria-labelledby="me-tab-codes" hidden>
          <form id="codes-gen-form" class="codes-gen">
            <label class="form-field">
              <span class="form-label">码类型</span>
              <select id="codes-kind" class="header-select">
                <option value="admin">管理员码</option>
              </select>
            </label>
            <button type="submit" class="btn btn-primary btn-sm">生成</button>
            <output id="codes-gen-out" class="codes-gen-out" aria-live="polite"></output>
          </form>
          <div class="table-wrap">
            <table class="data-table" id="codes-table">
              <thead><tr><th>码</th><th>类型</th><th>绑定选手</th><th>状态</th><th>使用人</th><th>签发</th></tr></thead>
              <tbody id="codes-tbody"></tbody>
            </table>
          </div>
        </section>
      </div>

    </main>
  </div>

  <script src="canvas-model.js?v=2026090036" defer></script>
  <script src="common.js?v=2026090036" defer></script>
  <script src="vs-poster/js/upload.js?v=2026090036" defer></script>
  <script src="my-decks.js?v=2026090036" defer></script>
  <script src="my-tourneys.js?v=2026090036" defer></script>
  <script src="profile.js?v=2026090036" defer></script>
  <script src="me.js?v=2026090036" defer></script>
</body>
</html>
