<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="view-transition" content="same-origin">
  <meta name="description" content="右手杯比赛：可查看与编辑赛程、比分及卡组。">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: https: data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <title>比赛 - 右手杯</title>
  <link rel="icon" href="icons/emoji_events.svg" type="image/svg+xml">
  <link rel="prefetch" href="index.html">
  <link rel="prefetch" href="players.html">
  <link rel="prefetch" href="poster.html">
  <script src="theme-init.js?v=2026090001"></script>
  <link rel="stylesheet" href="styles.css?v=2026090001">
</head>
<body data-page="schedule">
  <a class="skip-link" href="#main-content">跳到主要内容</a>
  <div id="bg-layer" aria-hidden="true"></div>
  <header id="app-header"></header>
  <aside id="app-sidebar" class="app-sidebar" aria-label="主导航">
    <nav class="side-nav" aria-label="主导航">
      <a class="side-link" href="index.html" data-page="home" title="主页" aria-label="主页"><span class="side-icon" aria-hidden="true"><img class="icon" src="icons/home.svg" alt="主页" aria-hidden="true"></span></a>
      <a class="side-link is-active" href="schedule.html" data-page="match" title="比赛" aria-label="比赛"><span class="side-icon" aria-hidden="true"><img class="icon" src="icons/emoji_events.svg" alt="比赛" aria-hidden="true"></span></a>
      <a class="side-link" href="players.html" data-page="players" title="选手库" aria-label="选手库"><span class="side-icon" aria-hidden="true"><img class="icon" src="icons/groups.svg" alt="选手库" aria-hidden="true"></span></a>
      <a class="side-link" href="poster.html" data-page="poster" title="海报" aria-label="海报"><span class="side-icon" aria-hidden="true"><img class="icon" src="icons/vs_poster.svg" alt="海报" aria-hidden="true"></span></a>
      <a class="side-link" href="stats.html" data-page="stats" title="数据统计" aria-label="数据统计"><span class="side-icon" aria-hidden="true"><img class="icon" src="icons/bar_chart.svg" alt="数据统计" aria-hidden="true"></span></a>
      <a class="side-link" href="me.html" data-page="me" title="选手中心" aria-label="选手中心"><span class="side-icon" aria-hidden="true"><img class="icon" src="icons/person.svg" alt="选手中心" aria-hidden="true"></span></a>
    </nav>
  </aside>

  <div class="layout-body layout-body-canvas" id="canvas-layout">
    <main id="main-content" tabindex="-1">
      <div class="champion-banner" id="champion-banner" hidden>
        <span class="medal" aria-hidden="true"><img class="icon" src="icons/emoji_events.svg" alt="" aria-hidden="true"></span>
        <span id="champion-text"></span>
      </div>

      <section class="list-view" id="list-view" aria-label="赛程列表">
        <div id="list-body"></div>
      </section>

      <div class="canvas-wrap-full" id="canvas-wrap">
        <div class="canvas-meta" id="canvas-meta" hidden></div>
        <div class="canvas-scroll canvas-scroll-full" id="canvas-scroll">
          <div class="canvas-stage" id="canvas-stage">
            <div class="canvas-board" id="canvas-board"></div>
          </div>
        </div>

        <div class="canvas-lock" id="canvas-lock" hidden>
          <div class="canvas-lock-card">
            <h2>需要管理员密码</h2>
            <p>比赛编辑需要管理员权限。</p>
            <input type="password" id="canvas-lock-password" placeholder="管理员密码" autocomplete="off">
            <div class="dialog-actions">
              <button type="button" id="canvas-lock-cancel" class="btn btn-secondary btn-sm">取消</button>
              <button type="button" id="canvas-lock-submit" class="btn btn-primary">解锁编辑</button>
            </div>
          </div>
        </div>

        <div class="zoom-dock" id="zoom-dock" role="group" aria-label="画布缩放">
          <button type="button" class="zoom-btn" data-zoom="out" title="缩小" aria-label="缩小画布"><img class="icon" src="icons/zoom_out.svg" alt="" aria-hidden="true"></button>
          <button type="button" class="zoom-btn zoom-level" data-zoom="reset" title="重置为 100%" aria-label="重置缩放为 100%"><span id="zoom-level">100%</span></button>
          <button type="button" class="zoom-btn" data-zoom="in" title="放大" aria-label="放大画布"><img class="icon" src="icons/zoom_in.svg" alt="" aria-hidden="true"></button>
          <button type="button" class="zoom-btn" data-zoom="fit" title="适应画布" aria-label="缩放到适应画布"><img class="icon" src="icons/fit_screen.svg" alt="" aria-hidden="true"></button>
        </div>
      </div>

      <!-- 卡片样式抽屉:palette 工具按钮唤出 -->
      <aside class="style-drawer" id="card-style-drawer" aria-label="卡片样式" hidden>
        <div class="style-drawer-title">卡片样式</div>
        <label class="tool-field">
          <span>不透明度 <output id="glass-opacity-val" for="glass-opacity">70%</output></span>
          <input type="range" id="glass-opacity" min="0.3" max="1" step="0.05" value="0.7">
        </label>
        <label class="tool-field">
          <span>模糊 <output id="glass-blur-val" for="glass-blur">8px</output></span>
          <input type="range" id="glass-blur" min="0" max="24" step="1" value="8">
        </label>
        <div class="tool-field">
          <span>染色 <output id="tint-target">未选中</output></span>
          <div class="tint-row">
            <input type="color" id="card-tint-input" value="#3563e9" title="给选中卡片染色(可框选/Shift 多选)">
            <button type="button" id="card-tint-clear" class="btn btn-secondary btn-sm">清除</button>
          </div>
        </div>
      </aside>
    </main>

    <aside class="edit-toolbar" id="edit-toolbar" aria-label="编辑工具" hidden>
      <div class="tool-group" role="group" aria-label="撤销">
        <button type="button" class="tool-btn" data-tool="undo" title="撤销 (Ctrl/Cmd+Z)" aria-label="撤销"><img class="icon" src="icons/undo.svg" alt="" aria-hidden="true"></button>
        <button type="button" class="tool-btn" data-tool="redo" title="重做 (Ctrl/Cmd+Shift+Z)" aria-label="重做"><img class="icon" src="icons/redo.svg" alt="" aria-hidden="true"></button>
      </div>
      <div class="tool-group" role="group" aria-label="编辑操作">
        <button type="button" class="tool-btn is-active" data-tool="select" title="选择 / 拖拽" aria-label="选择 / 拖拽"><img class="icon" src="icons/open_with.svg" alt="" aria-hidden="true"></button>
        <button type="button" class="tool-btn" data-tool="link" title="连线" aria-label="连线"><img class="icon" src="icons/link.svg" alt="" aria-hidden="true"></button>
        <button type="button" class="tool-btn" data-tool="add" title="添加卡片" aria-label="添加卡片"><img class="icon" src="icons/add.svg" alt="" aria-hidden="true"></button>
        <button type="button" class="tool-btn" data-tool="delete" title="批量删除模式" aria-label="批量删除模式"><img class="icon" src="icons/delete_sweep.svg" alt="" aria-hidden="true"></button>
        <button type="button" class="tool-btn danger" id="edit-delete-selected-btn" title="删除选中卡片" aria-label="删除选中卡片" hidden><img class="icon" src="icons/delete.svg" alt="" aria-hidden="true"></button>
      </div>
      <div class="tool-group" role="group" aria-label="视图缩放">
        <button type="button" class="tool-btn" data-tool="zoom" title="缩放模式" aria-label="缩放模式"><img class="icon" src="icons/search.svg" alt="" aria-hidden="true"></button>
        <button type="button" class="tool-btn" data-tool="zoom-in" title="放大" aria-label="放大"><img class="icon" src="icons/zoom_in.svg" alt="" aria-hidden="true"></button>
        <button type="button" class="tool-btn" data-tool="zoom-out" title="缩小" aria-label="缩小"><img class="icon" src="icons/zoom_out.svg" alt="" aria-hidden="true"></button>
        <button type="button" class="tool-btn" data-tool="fit" title="适应画布" aria-label="适应画布"><img class="icon" src="icons/fit_screen.svg" alt="" aria-hidden="true"></button>
      </div>
      <div class="tool-group" role="group" aria-label="外观与保存">
        <button type="button" class="tool-btn" data-tool="style" title="卡片样式" aria-label="卡片样式"><img class="icon" src="icons/palette.svg" alt="" aria-hidden="true"></button>
        <button type="button" class="tool-btn" data-tool="save" title="保存" aria-label="保存"><img class="icon" src="icons/save.svg" alt="" aria-hidden="true"><span class="save-dot" aria-hidden="true"></span></button>
      </div>
    </aside>
  </div>

  <script src="canvas-model.js?v=2026090001" defer></script>
  <script src="common.js?v=2026090001" defer></script>
  <script src="canvas-history.js?v=2026090001" defer></script>
  <script src="canvas-editor.js?v=2026090001" defer></script>
  <script src="bracket.js?v=2026090001" defer></script>
  <script src="list.js?v=2026090001" defer></script>
</body>
</html>
