<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="view-transition" content="same-origin">
  <meta name="description" content="右手杯比赛：可查看与编辑赛程、比分及卡组。">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: https: data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <title>比赛 - 右手杯</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏆</text></svg>">
  <link rel="prefetch" href="index.html">
  <link rel="prefetch" href="library.html">
  <link rel="prefetch" href="players.html">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="schedule">
  <a class="skip-link" href="#main-content">跳到主要内容</a>
  <div id="bg-layer" aria-hidden="true"></div>
  <header id="app-header"></header>
  <aside id="app-sidebar" class="app-sidebar" aria-label="主导航">
    <nav class="side-nav" aria-label="主导航">
      <a class="side-link" href="index.html" data-page="home" title="主页" aria-label="主页"><span class="side-icon" aria-hidden="true"><img class="icon" src="icons/home.svg" alt="主页" aria-hidden="true"></span></a>
      <a class="side-link is-active" href="schedule.html" data-page="match" title="比赛" aria-label="比赛"><span class="side-icon" aria-hidden="true"><img class="icon" src="icons/emoji_events.svg" alt="比赛" aria-hidden="true"></span></a>
      <a class="side-link" href="players.html" data-page="players" title="选手库" aria-label="选手库"><span class="side-icon" aria-hidden="true"><img class="icon" src="icons/groups.svg" alt="选手库" aria-hidden="true"></span></a>
    </nav>
  </aside>

  <div class="layout-body layout-body-canvas" id="canvas-layout">
    <main id="main-content" tabindex="-1">
      <div class="champion-banner" id="champion-banner" hidden>
        <span class="medal" aria-hidden="true">🏆</span>
        <span id="champion-text"></span>
      </div>

      <div class="canvas-wrap-full">
        <div class="canvas-hint" id="canvas-hint">查看模式</div>
        <div class="canvas-scroll canvas-scroll-full" id="canvas-scroll">
          <div class="canvas-stage" id="canvas-stage">
            <div class="canvas-board" id="canvas-board"></div>
          </div>
        </div>

        <div class="canvas-lock" id="canvas-lock" hidden>
          <div class="canvas-lock-card">
            <h2>需要管理员密码</h2>
            <p>比赛编辑需要管理员权限。</p>
            <input type="password" id="canvas-lock-password" placeholder="管理员密码" autocomplete="off">
            <div class="dialog-actions">
              <button type="button" id="canvas-lock-cancel" class="btn btn-secondary btn-sm">取消</button>
              <button type="button" id="canvas-lock-submit" class="btn btn-primary">解锁编辑</button>
            </div>
          </div>
        </div>
      </div>
    </main>

    <aside class="edit-toolbar" id="edit-toolbar" aria-label="编辑工具" hidden>
      <button type="button" class="tool-btn is-active" data-tool="select" title="选择 / 拖拽"><img class="icon" src="icons/open_with.svg" alt="选择 / 拖拽"></button>
      <button type="button" class="tool-btn" data-tool="link" title="连线"><img class="icon" src="icons/link.svg" alt="连线"></button>
      <button type="button" class="tool-btn" data-tool="add" title="添加卡片"><img class="icon" src="icons/add.svg" alt="添加卡片"></button>
      <button type="button" class="tool-btn" data-tool="format-size" title="画布大小"><img class="icon" src="icons/format_size.svg" alt="画布大小"></button>
      <button type="button" class="tool-btn" data-tool="zoom" title="缩放模式"><img class="icon" src="icons/search.svg" alt="缩放模式"></button>
      <button type="button" class="tool-btn" data-tool="zoom-in" title="放大"><img class="icon" src="icons/zoom_in.svg" alt="放大"></button>
      <button type="button" class="tool-btn" data-tool="zoom-out" title="缩小"><img class="icon" src="icons/zoom_out.svg" alt="缩小"></button>
      <button type="button" class="tool-btn" data-tool="fit" title="适应画布"><img class="icon" src="icons/fit_screen.svg" alt="适应画布"></button>
      <button type="button" class="tool-btn" data-tool="delete" title="批量删除模式"><img class="icon" src="icons/delete_sweep.svg" alt="批量删除模式"></button>
      <button type="button" class="tool-btn danger" id="edit-delete-selected-btn" title="删除选中卡片" hidden><img class="icon" src="icons/delete.svg" alt="删除选中卡片"></button>
      <button type="button" class="tool-btn" data-tool="save" title="保存"><img class="icon" src="icons/save.svg" alt="保存"></button>
    </aside>
  </div>

  <script src="canvas-model.js" defer></script>
  <script src="common.js" defer></script>
  <script src="deck-modal.js" defer></script>
  <script src="canvas-editor.js" defer></script>
  <script src="bracket.js" defer></script>
</body>
</html>
